[tool.poetry]
name = "pybeepop-plus"
version = "0.2.0"
description = "EPA's Python interface for the EPA/USDA honey bee colony model BeePop+"
authors = ["Jeffrey Minucci <minucci.jeffrey@epa.gov>"]
maintainers = ["Jeffrey Minucci <minucci.jeffrey@epa.gov>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/USEPA/pybeepop"
documentation = "https://usepa.github.io/pybeepop/"
packages = [
    { include = "pybeepop", from ="." },
]
include = ["lib/*.dll", "lib/*.so", "lib/*.dylib", "data/*"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python",
    "Intended Audience :: Science/Research",
]

[tool.poetry.dependencies]
python = "^3.8.0"
pandas = "^2.0.0"
matplotlib = "^3.1.0"

[build-system]
requires = ["poetry-core", "setuptools"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.build]
script = "build.py"
generate-setup-file = true

[tool.cibuildwheel.linux]
before-all = ["yum -y install cmake",
    "cd beepop",
    "mkdir build",
    "cd build",
    "cmake -DCMAKE_POSITION_INDEPENDENT_CODE=ON ..",
    "cmake --build . --config Release",
    "pwd",
    "cp liblibvpop.so ../../pybeepop/lib",
    "mv -f ../../pybeepop/lib/liblibvpop.so ../../pybeepop/lib/beepop_linux.so",
]

[tool.cibuildwheel.windows]
before-all = [
    "cd beepop",
    "mkdir build",
    "cd build",
    "cmake -DCMAKE_POSITION_INDEPENDENT_CODE=ON ..",
    "cmake --build . --config Release",
    "copy Release\\libvpop.dll ..\\..\\pybeepop\\lib",
    "move /y ..\\..\\pybeepop\\lib\\libvpop.dll ..\\..\\pybeepop\\lib\\beepop_win64.dll",
]

[tool.cibuildwheel.macos]
archs = ["arm64"]
environment = { ARCHFLAGS="-arch arm64", _PYTHON_HOST_PLATFORM="macosx-11.0-arm64" }
before-all = [
    "brew install cmake || true",
    "cd beepop",
    "mkdir -p build",
    "cd build",
    "cmake -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_CXX_FLAGS='-Wno-error=non-pod-varargs -Wno-error=format-security' ..",
    "cmake --build . --config Release",
    "cp liblibvpop.dylib ../../pybeepop/lib/beepop_macos.dylib",
    "file ../../pybeepop/lib/beepop_macos.dylib",
    "otool -L ../../pybeepop/lib/beepop_macos.dylib",
]
test-command = "python -c \"import sys; print('Python version:', sys.version); import platform; print('Platform:', platform.machine()); from pybeepop import PyBeePop; print('Import successful'); bee = PyBeePop(engine='cpp', verbose=True); print('✓ C++ engine loaded successfully on macOS')\""
test-requires = ["pandas>=2.0.0", "matplotlib>=3.1.0"]

[[tool.cibuildwheel.overrides]]
select = "*-musllinux*"
before-all = ["apk add cmake",
    "cd beepop",
    "mkdir build",
    "cd build",
    "cmake -DCMAKE_POSITION_INDEPENDENT_CODE=ON ..",
    "cmake --build . --config Release",
    "pwd",
    "cp liblibvpop.so ../../pybeepop/lib",
    "mv -f ../../pybeepop/lib/liblibvpop.so ../../pybeepop/lib/beepop_linux.so",
]
