[tool.poetry]
name = "pybeepop-plus"
version = "0.3.0"
description = "EPA's Python interface for the EPA/USDA honey bee colony model BeePop+"
authors = ["Jeffrey Minucci <minucci.jeffrey@epa.gov>"]
maintainers = ["Jeffrey Minucci <minucci.jeffrey@epa.gov>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/USEPA/pybeepop"
documentation = "https://usepa.github.io/pybeepop/"
packages = [
    { include = "pybeepop", from ="." },
]
include = ["data/*"]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Intended Audience :: Science/Research",
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
pandas = "^2.0.0"
matplotlib = "^3.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
