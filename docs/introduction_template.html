<!DOCTYPE html>
<html>
<head>
    <title>pybeepop+ Introduction</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #f8fafc 0%, #e3e8ee 100%);
        }
        .header {
            background: #fec44f;
            color: #222;
            padding: 32px 0 18px 0;
            text-align: center;
            box-shadow: 0 2px 8px rgba(60, 72, 88, 0.08);
        }
        .header h1 {
            margin: 0 0 10px 0;
            font-size: 3.2rem;
            letter-spacing: 1px;
            color: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5em;
        }
        .header h1 .bee {
            font-size: 2.2rem;
            margin-right: 0.3em;
        }
        .header p {
            margin: 0 0 8px 0;
            font-size: 1.1rem;
            color: #222;
        }
        .badges {
            margin: 10px 0 0 0;
        }
        .badges img {
            margin: 0 6px 0 0;
            vertical-align: middle;
            height: 24px;
        }
        .container {
            max-width: 850px;
            margin: 32px auto 0 auto;
            padding: 32px 24px 24px 24px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 6px 32px rgba(60, 72, 88, 0.10), 0 1.5px 6px rgba(60, 72, 88, 0.08);
        }
        .back-link {
            margin-bottom: 18px;
            display: block;
        }
        @media (max-width: 600px) {
            .container {
                padding: 12px 2vw;
            }
            .header h1 {
                font-size: 1.5rem;
            }
            .header p {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1><span class="bee">🐝</span>pybeepop+</h1>
        <p>Python-based interface for the USDA/EPA's honey bee colony model <b>BeePop+</b>.</p>
        <p>For more information about <b>BeePop+</b> see <a href="https://doi.org/10.3390/ecologies3030022" style="color:#222;text-decoration:underline;">Garber <i>et al.</i> 2022, Ecologies</a>.</p>
        <p>For more information about <b>pybeepop+</b> see <a href="" style="color:#222;text-decoration:underline;">Minucci 2025, Journal of Open Research Software</a>.</p>
        <div class="badges">
            <img src="https://github.com/USEPA/pybeepop/actions/workflows/run-tests-windows.yml/badge.svg" alt="Tests (Windows)">
            <img src="https://github.com/USEPA/pybeepop/actions/workflows/run-tests-ubuntu.yml/badge.svg" alt="Tests (Linux)">
            <img src="https://badge.fury.io/py/pybeepop-plus.svg" alt="PyPI version">
        </div>
    </div>
    <div class="container">
        <a class="back-link" href="index.html">← Back to Documentation Home</a>
        $body$
    </div>
</body>
</html>
