name: PyTests

on: [push, pull_request]

jobs:
  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Version axis carries the real signal: pybeepop is pure Python, so what
      # actually varies across interpreters is dependency resolution (pandas,
      # matplotlib). The OS axis only mattered when we shipped per-platform
      # binaries, so it is trimmed to a single newest-Python job each.
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -e .
      - name: Test with pytest and generate coverage report
        run: |
          pytest --cov=pybeepop --cov-report=term tests -v
          coverage report -m
