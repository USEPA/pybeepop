name: Generate Docs Website

# build the documentation whenever there are new commits on main
on:
  push:
    branches:
      - main
    paths:
      - pybeepop/**
      - tests/**
      - .github/workflows/generate-docs-site.yml
      - docs/**/*.html
      - docs/styles.css
      - docs/_hero_fragment.html

permissions:
  contents: read

jobs:
  # Build the documentation and upload the static HTML files as an artifact.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Install dependencies for docs and testing
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install pdoc3
          pip install -e .

      # Install pandoc for markdown to HTML conversion
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      # Run tests and generate coverage report
      - name: Run tests and generate coverage report
        run: |
          pytest --cov=pybeepop --cov-report=term tests -v || true
          coverage report -m || true
          coverage html || true

      # Generate API documentation
      - run: pdoc --html --skip-errors -o docs/ pybeepop

      # Move coverage report into docs
      - name: Move coverage report into docs
        run: |
          mkdir -p docs/pybeepop/coverage
          cp -r htmlcov/* docs/pybeepop/coverage/

      # Generate parameters.html from CSV
      - name: Generate parameters HTML
        run: python docs/generate_parameters_html.py

      # Convert README.md to introduction.html
      - name: Convert README.md to introduction.html
        run: |
          pandoc README.md -f markdown -t html -s --template=docs/introduction_template.html -o docs/pybeepop/introduction.html

      # Inject hero fragment and copy site files
      - name: Copy and assemble site files
        run: |
          python - <<'EOF'
          from pathlib import Path

          DOCS = Path("docs")
          SITE = DOCS / "pybeepop"
          hero = (DOCS / "_hero_fragment.html").read_text(encoding="utf-8")

          def inject_hero(html_text, active_page):
              fragment = (
                  hero
                  .replace("__ACTIVE_HOME__", " active" if active_page == "home" else "")
                  .replace("__ACTIVE_INTRO__", " active" if active_page == "intro" else "")
                  .replace("__ACTIVE_PARAMS__", " active" if active_page == "params" else "")
              )
              return html_text.replace("<!-- HERO_PLACEHOLDER -->", fragment)

          # index.html
          index_html = (DOCS / "index_template.html").read_text(encoding="utf-8")
          (SITE / "index.html").write_text(inject_hero(index_html, "home"), encoding="utf-8")

          # introduction.html (already generated by pandoc)
          intro_path = SITE / "introduction.html"
          intro_html = intro_path.read_text(encoding="utf-8")
          intro_html = inject_hero(intro_html, "intro")
          intro_html = intro_html.replace('src="docs/assets/', 'src="assets/')
          intro_path.write_text(intro_html, encoding="utf-8")

          # parameters.html
          import shutil
          shutil.copy2(DOCS / "parameters.html", SITE / "parameters.html")

          # styles.css
          shutil.copy2(DOCS / "styles.css", SITE / "styles.css")

          # assets
          import os
          assets_src = DOCS / "assets"
          assets_dst = SITE / "assets"
          assets_dst.mkdir(parents=True, exist_ok=True)
          for f in assets_src.iterdir():
              shutil.copy2(f, assets_dst / f.name)
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/pybeepop/

  # Deploy the artifact to GitHub pages.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
