name: Generate Docs Website

# build the documentation whenever there are new commits on main
on:
  push:
    branches:
      - main
    paths:
      - pybeepop/**
      - tests/**
      - .github/workflows/generate-docs-site.yml
      - docs/**/*.html

permissions:
  contents: read

jobs:
  # Build the documentation and upload the static HTML files as an artifact.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Install dependencies for docs and testing
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install pdoc3 pandas matplotlib
          pip install -r requirements.txt

      # Install pandoc for markdown to HTML conversion
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      # Run tests and generate coverage report
      - name: Run tests and generate coverage report
        run: |
          pytest --cov=pybeepop --cov-report=term tests -v || true
          coverage report -m || true
          coverage html || true

      # Generate API documentation
      - run: pdoc --html --skip-errors -o docs/ pybeepop

      # Move coverage report into docs
      - name: Move coverage report into docs
        run: |
          mkdir -p docs/pybeepop/coverage
          cp -r htmlcov/* docs/pybeepop/coverage/

      # Convert README.md to introduction.html
      - name: Convert README.md to introduction.html
        run: |
          pandoc README.md -f markdown -t html -s --template=docs/introduction_template.html -o docs/pybeepop/introduction.html

      # Copy index and parameters html files to docs/pybeepop
      - name: Copy index and parameters html files
        run: |
          cp docs/index_template.html docs/pybeepop/index.html
          cp docs/parameters.html docs/pybeepop/parameters.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/pybeepop/

  # Deploy the artifact to GitHub pages.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
