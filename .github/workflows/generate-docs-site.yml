name: Generate Docs Website

# build the documentation whenever there are new commits on main
on:
  push:
    branches:
      - main
    paths:
      - pybeepop/**
      - .github/workflows/generate-docs-site.yml
  workflow_run:
    workflows: ["Run PyTests on Ubuntu"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  # Build the documentation and upload the static HTML files as an artifact.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Install dependencies for docs
      - run: pip install pdoc3 pandas matplotlib

      # Generate API documentation
      - run: pdoc --html --skip-errors -o docs/ pybeepop

      # Download coverage report from Ubuntu test workflow
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: docs/pybeepop/coverage
        continue-on-error: true

      # Create an index page that links to both docs and coverage
      - name: Create index page
        run: |
          cat > docs/pybeepop/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <title>pybeepop+ Documentation</title>
              <style>
                  body { font-family: Arial, sans-serif; margin: 40px; }
                  h1 { color: #333; }
                  .container { max-width: 800px; margin: 0 auto; }
                  .box { 
                      border: 1px solid #ddd; 
                      padding: 20px; 
                      margin: 20px 0;
                      border-radius: 5px;
                  }
                  a { color: #0066cc; text-decoration: none; }
                  a:hover { text-decoration: underline; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>pybeepop+ Documentation</h1>
                  
                  <div class="box">
                      <h2>📚 API Documentation</h2>
                      <p>Detailed documentation of all pybeepop+ classes and functions.</p>
                      <p><a href="pybeepop.html">View API Documentation →</a></p>
                  </div>
                  
                  <div class="box">
                      <h2>📊 Code Coverage Report</h2>
                      <p>Test coverage analysis showing which parts of the code are tested.</p>
                      <p><a href="coverage/index.html">View Coverage Report →</a></p>
                  </div>
                  
                  <div class="box">
                      <h2>🔗 Quick Links</h2>
                      <ul>
                          <li><a href="https://github.com/USEPA/pybeepop">GitHub Repository</a></li>
                          <li><a href="https://pypi.org/project/pybeepop-plus/">PyPI Package</a></li>
                      </ul>
                  </div>
              </div>
          </body>
          </html>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/pybeepop/

  # Deploy the artifact to GitHub pages.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4