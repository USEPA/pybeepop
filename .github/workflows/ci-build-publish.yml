name: CI-Build-Publish

on:
    push:
      branches:
        - main
      paths:
        - pybeepop/**
        - .github/workflows/ci-build-publish.yml
        - pyproject.toml
    pull_request:
      paths:
        - pybeepop/**
        - .github/workflows/ci-build-publish.yml
        - pyproject.toml
    release:
      types: [ published ]
    workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build wheel and source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: pipx run poetry build

      - name: Check wheel is platform independent
        run: |
          ls dist/
          test -n "$(find dist -name '*-py3-none-any.whl')"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz

  upload_testpypi:
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pybeepop-plus
    permissions:
      id-token: write
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  upload_pypi:
      needs: [build]
      runs-on: ubuntu-latest
      environment:
        name: pypi
        url: https://pypi.org/p/pybeepop-plus
      permissions:
        id-token: write
      if: github.event_name == 'release' && github.event.action == 'published'
      steps:
        - uses: actions/download-artifact@v4
          with:
            name: dist
            path: dist

        - uses: pypa/gh-action-pypi-publish@release/v1
          with:
            skip-existing: true
