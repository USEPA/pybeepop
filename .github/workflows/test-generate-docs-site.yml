name: Test Generate Docs Website

on:
  push:
    branches:
      - jors-revision
    paths:
      - pybeepop/**
      - .github/workflows/test-generate-docs-site.yml
  workflow_run:
    workflows: ["Run PyTests on Ubuntu"]
    types:
      - completed
    branches:
      - jors-revision

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pdoc3 pandas matplotlib

      - run: pdoc --html --skip-errors -o docs/ pybeepop

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: docs/pybeepop/coverage
        continue-on-error: true

      - name: Create index page
        run: |
          cat > docs/pybeepop/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <title>pybeepop+ Documentation</title>
              <style>
                  body { font-family: Arial, sans-serif; margin: 40px; }
                  h1 { color: #333; }
                  .container { max-width: 800px; margin: 0 auto; }
                  .box { 
                      border: 1px solid #ddd; 
                      padding: 20px; 
                      margin: 20px 0;
                      border-radius: 5px;
                  }
                  a { color: #0066cc; text-decoration: none; }
                  a:hover { text-decoration: underline; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>pybeepop+ Documentation</h1>
                  
                  <div class="box">
                      <h2>📚 API Documentation</h2>
                      <p>Detailed documentation of all pybeepop+ classes and functions.</p>
                      <p><a href="pybeepop.html">View API Documentation →</a></p>
                  </div>
                  
                  <div class="box">
                      <h2>📊 Code Coverage Report</h2>
                      <p>Test coverage analysis showing which parts of the code are tested.</p>
                      <p><a href="coverage/index.html">View Coverage Report →</a></p>
                  </div>
                  
                  <div class="box">
                      <h2>🔗 Quick Links</h2>
                      <ul>
                          <li><a href="https://github.com/USEPA/pybeepop">GitHub Repository</a></li>
                          <li><a href="https://pypi.org/project/pybeepop-plus/">PyPI Package</a></li>
                      </ul>
                  </div>
              </div>
          </body>
          </html>
          EOF

      - name: Upload docs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-docs-site
          path: docs/pybeepop/
