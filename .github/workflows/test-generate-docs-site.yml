name: Test Generate Docs Website

on:
  push:
    branches:
      - jors-revision
    paths:
      - pybeepop/**
      - tests/**
      - .github/workflows/test-generate-docs-site.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install pdoc3 pandas matplotlib
          pip install -r requirements.txt

      - name: Run tests and generate coverage report
        run: |
          pytest --cov=pybeepop --cov-report=term tests -v || true
          coverage report -m || true
          coverage html || true

      - run: pdoc --html --skip-errors -o docs/ pybeepop

      - name: Move coverage report into docs
        run: |
          mkdir -p docs/pybeepop/coverage
          cp -r htmlcov/* docs/pybeepop/coverage/

      - name: Create index page
        run: |
          cp docs/index_template.html docs/pybeepop/index.html

      - name: Upload docs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-docs-site
          path: docs/pybeepop/
